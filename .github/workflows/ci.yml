name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned rather than taken from the runner image, so a lint failure here
      # reproduces against the same version locally.
      - name: Install actionlint
        env:
          VERSION: 1.7.12
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz" |
            tar -xz -C /usr/local/bin actionlint

      - run: actionlint -color
      - run: shellcheck setup/pm.sh

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        pm: [pnpm, npm, bun, yarn]

    steps:
      # The action reads the lockfile from the working directory and `uses:`
      # steps cannot be given a `working-directory`, so the fixture has to BE
      # the workspace root. The action itself is checked out beside it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .action

      - name: Write the ${{ matrix.pm }} fixture
        env:
          PM: ${{ matrix.pm }}
        run: |
          set -euo pipefail
          case "$PM" in
            pnpm) tool='pnpm = "latest"' ;;
            npm) tool='' ;;
            bun) tool='bun = "latest"' ;;
            yarn) tool='yarn = "latest"' ;;
          esac
          printf '[tools]\nnode = "lts"\n%s\n' "$tool" > mise.toml
          printf '{\n  "name": "fixture",\n  "version": "0.0.0",\n  "private": true,\n  "dependencies": { "is-odd": "3.0.1" }\n}\n' > package.json

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Generate the ${{ matrix.pm }} lockfile
        env:
          PM: ${{ matrix.pm }}
        run: |
          set -euo pipefail
          case "$PM" in
            pnpm) pnpm install --lockfile-only ;;
            npm) npm install --package-lock-only ;;
            # bun has no lockfile-only mode; a full install is the cheapest way
            # to get a real bun.lock, and the action re-runs it from cache after.
            bun) bun install ;;
            yarn)
              # The runner ships Classic, which the action's Berry guard rejects.
              yarn set version berry
              # Berry refuses to create a lockfile under CI=true; creating one
              # is this step's whole job.
              YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn install
              ;;
          esac

      - name: Run the action under test
        uses: ./.action/setup

      # Resolving the dependency proves the install landed; a node_modules
      # directory test would not, since Yarn PnP never writes one.
      - name: Assert the dependency resolves after install
        env:
          PM: ${{ matrix.pm }}
        run: |
          set -euo pipefail
          script="require.resolve('is-odd')"
          case "$PM" in
            # Yarn PnP resolution only exists inside `yarn node`.
            yarn) yarn node -e "$script" ;;
            *) node -e "$script" ;;
          esac

  # The whole action is out of reach here: mise verifies a node install by
  # running npm, whose launcher is a bash script. pm.sh's dispatch is what fits.
  alpine:
    name: Alpine
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: alpine:3.22

    defaults:
      run:
        shell: sh

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert the image really has no bash
        run: |
          set -eu
          command -v bash && exit 1
          true

      # A stub on PATH stands in for the real package manager.
      - name: Dispatch without bash
        run: |
          set -eu
          mkdir -p stub
          printf '#!/bin/sh\necho /stub/store\n' > stub/pnpm
          chmod +x stub/pnpm
          PATH="$PWD/stub:$PATH"
          export PATH

          [ "$(setup/pm.sh store pnpm)" = /stub/store ]
          setup/pm.sh store nope && exit 1
          setup/pm.sh bogus pnpm && exit 1
          true
