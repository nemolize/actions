name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned rather than taken from the runner image, so a lint failure here
      # reproduces against the same version locally.
      - name: Install actionlint
        env:
          VERSION: 1.7.12
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz" |
            tar -xz -C /usr/local/bin actionlint

      - run: actionlint -color
      - run: shellcheck setup/pm.sh

  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      # Globbed rather than named, so an action added later is covered without
      # touching this job.
      - run: node --test ./*/test/*.test.mjs

  upsert-self-test:
    name: Upsert Self Test
    # A fork's token cannot write, so the action correctly no-ops there and the
    # assertions below would have nothing to assert.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start from a description without the block
        uses: ./upsert
        with:
          marker: self-test
          mode: remove

      - id: write
        uses: ./upsert
        with:
          marker: self-test
          body: |
            ### Self test

            Written by `${{ github.sha }}`.

      - id: rewrite
        uses: ./upsert
        with:
          marker: self-test
          body: |
            ### Self test

            Written by `${{ github.sha }}`.

      - id: clear
        uses: ./upsert
        with:
          marker: self-test
          mode: remove

      - name: Each step must report what it actually did
        env:
          WROTE: ${{ steps.write.outputs.changed }}
          REWROTE: ${{ steps.rewrite.outputs.changed }}
          CLEARED: ${{ steps.clear.outputs.changed }}
        run: |
          set -eu
          fail=0
          check() {
            [ "$2" = "$3" ] || { echo "::error::$1 reported changed=$2, expected $3"; fail=1; }
          }
          check "the first write" "$WROTE" true
          check "writing the same content again" "$REWROTE" false
          check "removing the block" "$CLEARED" true
          exit "$fail"

  setup-integration-test:
    name: Setup Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # Which filenames the cache key covers is settled in setup/test, against
        # the patterns read out of action.yml. These rows carry the part that
        # needs a runner: that mise resolves the config and the install lands.
        include:
          - pm: pnpm
            mise-config: mise.toml
          - pm: npm
            mise-config: .mise.toml
          - pm: bun
            mise-config: .config/mise.toml
          - pm: yarn
            mise-config: mise/config.toml
          # A profile config is only read when MISE_ENV names it, so this row
          # carries the variable the other four do not need.
          - pm: pnpm
            mise-config: mise.ci.toml
            mise-env: ci

    env:
      MISE_ENV: ${{ matrix.mise-env }}

    steps:
      # The action reads the lockfile from the working directory and `uses:`
      # steps cannot be given a `working-directory`, so the fixture has to BE
      # the workspace root. The action itself is checked out beside it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .action

      - name: Write the ${{ matrix.pm }} fixture
        env:
          PM: ${{ matrix.pm }}
          MISE_CONFIG: ${{ matrix.mise-config }}
        run: |
          set -euo pipefail
          case "$PM" in
            pnpm) tool='pnpm = "latest"' ;;
            npm) tool='' ;;
            bun) tool='bun = "latest"' ;;
            yarn) tool='yarn = "latest"' ;;
          esac
          mkdir -p "$(dirname "$MISE_CONFIG")"
          printf '[tools]\nnode = "lts"\n%s\n' "$tool" > "$MISE_CONFIG"
          printf '{\n  "name": "fixture",\n  "version": "0.0.0",\n  "private": true,\n  "dependencies": { "is-odd": "3.0.1" }\n}\n' > package.json

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Generate the ${{ matrix.pm }} lockfile
        env:
          PM: ${{ matrix.pm }}
        run: |
          set -euo pipefail
          case "$PM" in
            pnpm) pnpm install --lockfile-only ;;
            npm) npm install --package-lock-only ;;
            # bun has no lockfile-only mode; a full install is the cheapest way
            # to get a real bun.lock, and the action re-runs it from cache after.
            bun) bun install ;;
            yarn)
              # The runner ships Classic, which the action's Berry guard rejects.
              yarn set version berry
              # Berry refuses to create a lockfile under CI=true; creating one
              # is this step's whole job.
              YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn install
              ;;
          esac

      - name: Run the action under test
        uses: ./.action/setup

      # Resolving the dependency proves the install landed; a node_modules
      # directory test would not, since Yarn PnP never writes one.
      - name: Assert the dependency resolves after install
        env:
          PM: ${{ matrix.pm }}
        run: |
          set -euo pipefail
          script="require.resolve('is-odd')"
          case "$PM" in
            # Yarn PnP resolution only exists inside `yarn node`.
            yarn) yarn node -e "$script" ;;
            *) node -e "$script" ;;
          esac
