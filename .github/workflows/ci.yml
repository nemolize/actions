name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned rather than taken from the runner image, so a lint failure here
      # reproduces against the same version locally.
      - name: Install actionlint
        env:
          VERSION: 1.7.12
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz" |
            tar -xz -C /usr/local/bin actionlint

      - run: actionlint -color
      - run: shellcheck ./*/*.sh

  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      # Globbed rather than named, so an action added later is covered without
      # touching this job.
      - run: node --test ./*/test/*.test.mjs

  upsert-self-test:
    name: Upsert Self Test
    # A fork's token cannot write, so the action correctly no-ops there and the
    # assertions below would have nothing to assert.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start from a description without the block
        uses: ./upsert
        with:
          marker: self-test
          mode: remove

      - id: write
        uses: ./upsert
        with:
          marker: self-test
          body: |
            ### Self test

            Written by `${{ github.sha }}`.

      - id: rewrite
        uses: ./upsert
        with:
          marker: self-test
          body: |
            ### Self test

            Written by `${{ github.sha }}`.

      - id: clear
        uses: ./upsert
        with:
          marker: self-test
          mode: remove

      - name: Each step must report what it actually did
        env:
          WROTE: ${{ steps.write.outputs.changed }}
          REWROTE: ${{ steps.rewrite.outputs.changed }}
          CLEARED: ${{ steps.clear.outputs.changed }}
        run: |
          set -eu
          fail=0
          check() {
            [ "$2" = "$3" ] || { echo "::error::$1 reported changed=$2, expected $3"; fail=1; }
          }
          check "the first write" "$WROTE" true
          check "writing the same content again" "$REWROTE" false
          check "removing the block" "$CLEARED" true
          exit "$fail"

  setup-integration-legs:
    name: Setup Integration Test (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # `no override` is the ordinary case; the node legs differ from it and
        # from each other ONLY by the override that has to reach both keys.
        include:
          - label: no override
            node: ""
          - label: node 22
            node: "22"
          - label: node 24
            node: "24"

    # Job-level, so it reaches the action's own steps. A `uses:` step's `env:`
    # applies to that step's process, which is not where mise reads it.
    env:
      MISE_NODE_VERSION: ${{ matrix.node }}

    steps:
      # The action reads the lockfile from the working directory and `uses:`
      # steps cannot be given a `working-directory`, so the fixture has to BE
      # the workspace root. The action itself is checked out beside it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .action

      - name: Write the fixture
        run: |
          set -euo pipefail
          printf '[tools]\nnode = "lts"\npnpm = "latest"\n' > mise.toml
          printf '{\n  "name": "fixture",\n  "version": "0.0.0",\n  "private": true,\n  "dependencies": { "is-odd": "3.0.1" }\n}\n' > package.json

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # Matches the pin in setup/action.yml so the fixture's lockfile is
          # written by the same mise the action under test then runs.
          version: 2026.8.6

      - run: pnpm install --lockfile-only

      - name: Run the action under test
        uses: ./.action/setup

      # Resolving the dependency proves the install landed.
      - run: node -e "require.resolve('is-odd')"

      # The override has to reach the toolchain that ran, not just the key.
      - name: The override selected the Node that ran
        if: matrix.node != ''
        env:
          WANT: ${{ matrix.node }}
        run: |
          set -euo pipefail
          got="$(node -p 'process.versions.node.split(".")[0]')"
          [ "$got" = "$WANT" ] || {
            echo "::error::MISE_NODE_VERSION=$WANT but node $got ran"
            exit 1
          }
          echo "node $got, as the override asked"

      # The unit tests assert the digest's properties against the script; this
      # asserts them against the script as the runner actually resolves it.
      - name: Legs differing only by the override must not share a key
        run: |
          set -euo pipefail
          script=./.action/setup/mise-overrides.sh
          none="$(env -u MISE_NODE_VERSION sh "$script")"
          blank="$(MISE_NODE_VERSION='' sh "$script")"
          n22="$(MISE_NODE_VERSION=22 sh "$script")"
          n24="$(MISE_NODE_VERSION=24 sh "$script")"
          alias24="$(env -u MISE_NODE_VERSION MISE_NODEJS_VERSION=24 sh "$script")"
          fail=0
          [ -z "$none" ] || { echo "::error::no override must answer empty, got '$none'"; fail=1; }
          [ -z "$blank" ] || { echo "::error::a blank override must answer empty, got '$blank'"; fail=1; }
          [ "$n22" != "$n24" ] || { echo "::error::node 22 and 24 share the digest '$n22'"; fail=1; }
          [ "$alias24" = "$n24" ] || { echo "::error::MISE_NODEJS_VERSION keyed apart from MISE_NODE_VERSION"; fail=1; }
          exit "$fail"

  # The matrix legs each carry their own name, so none of them can BE the
  # required status check. This one keeps that name and fails if any leg did.
  setup-integration-test:
    name: Setup Integration Test
    needs: setup-integration-legs
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.setup-integration-legs.result }}
        run: |
          set -eu
          [ "$RESULT" = success ] || { echo "::error::integration legs: $RESULT"; exit 1; }
          echo "every leg passed"
