name: "Setup toolchain and install dependencies"
description: "Install mise-managed tools, then install dependencies with the package manager the lockfile selects"

runs:
  using: "composite"
  steps:
    - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

    - id: pm
      # `sh`, not `bash`: a composite action's shell name is resolved literally,
      # with no fallback, so `bash` would fail outright on an image that lacks it.
      shell: sh
      run: |
        set -eu
        if [ -f pnpm-lock.yaml ]; then
          name=pnpm
          lockfile=pnpm-lock.yaml
        elif [ -f package-lock.json ]; then
          name=npm
          lockfile=package-lock.json
        elif [ -f bun.lock ]; then
          name=bun
          lockfile=bun.lock
        elif [ -f bun.lockb ]; then
          name=bun
          lockfile=bun.lockb
        elif [ -f yarn.lock ]; then
          name=yarn
          lockfile=yarn.lock
          # yarn.lock is also Yarn Classic's lockfile, and Classic has neither
          # `--immutable` nor a `cacheFolder` setting — it answers `undefined`.
          major=$(yarn --version)
          major=${major%%.*}
          if [ "$major" -lt 2 ]; then
            echo "::error::yarn $major detected; this action supports Yarn Berry (>= 2) only"
            exit 1
          fi
        else
          echo "::error::no lockfile found (looked for pnpm-lock.yaml, package-lock.json, bun.lock, bun.lockb, yarn.lock)"
          exit 1
        fi

        store=$("$GITHUB_ACTION_PATH/pm.sh" store "$name")
        if [ -z "$store" ] || [ "$store" = "undefined" ]; then
          echo "::error::$name reported no cache directory (got '$store')"
          exit 1
        fi

        # Asking mise what it read beats guessing at filenames: the profile
        # MISE_ENV picked is accounted for, and only hashable paths survive.
        # `sed`, not `jq`: the action's other steps hold to `sh` and no more.
        configs=$(mise config ls --json |
          sed -n 's/^ *"path": "\(.*\)",*$/\1/p' |
          sed -n "s|^$GITHUB_WORKSPACE/||p")
        if [ -z "$configs" ]; then
          echo "::error::mise reported no config file under $GITHUB_WORKSPACE"
          exit 1
        fi

        {
          echo "name=$name"
          echo "lockfile=$lockfile"
          echo "store=$store"
          echo "mise_configs<<MISE_CONFIGS_EOF"
          echo "$configs"
          echo "MISE_CONFIGS_EOF"
        } >> "$GITHUB_OUTPUT"
        echo "detected $name, store at $store"
        echo "mise config: $(echo "$configs" | tr '\n' ' ')"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pm.outputs.store }}
        # The store path is absent from the key on purpose: actions/cache already
        # hashes `path` into its own cache version, so a container job and a host
        # job never share an entry even under an identical key.
        # MISE_ENV sits ahead of the hash so the restore-keys prefix below can
        # stop before it; the hash reflects the profile too, but a prefix that
        # stopped at the OS would match whatever store another profile built.
        key: >-
          ${{ steps.pm.outputs.name }}-store-${{ runner.os }}-${{ env.MISE_ENV
          }}-${{ hashFiles(steps.pm.outputs.lockfile,
          steps.pm.outputs.mise_configs) }}
        restore-keys: ${{ steps.pm.outputs.name }}-store-${{ runner.os }}-${{ env.MISE_ENV }}-

    - shell: sh
      env:
        PM: ${{ steps.pm.outputs.name }}
      run: |
        "$GITHUB_ACTION_PATH/pm.sh" install "$PM"
