name: "Setup toolchain and install dependencies"
description: "Install mise-managed tools, then install dependencies with the package manager the lockfile selects"

runs:
  using: "composite"
  steps:
    # Ahead of mise-action, whose own tool cache needs the same answer: its key
    # covers the configs and MISE_ENV, so two legs share one entry without this.
    - id: overrides
      shell: sh
      run: |
        set -eu
        # The separator ships with the digest rather than beside it in the key,
        # so an empty answer leaves both keys byte-identical to what they were.
        digest=$("$GITHUB_ACTION_PATH/mise-overrides.sh")
        echo "segment=${digest:+-$digest}" >> "$GITHUB_OUTPUT"

    - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      with:
        # CalVer, ~20 releases a month, no compatibility promise across them: an
        # unpinned mise reaches every consumer the day it regresses.
        version: 2026.8.6
        cache_key: "{{default}}${{ steps.overrides.outputs.segment }}"

    - id: pm
      # `sh`, not `bash`: a composite action's shell name is resolved literally,
      # with no fallback, so `bash` would fail outright on an image that lacks it.
      shell: sh
      run: |
        set -eu
        if [ -f pnpm-lock.yaml ]; then
          name=pnpm
          lockfile=pnpm-lock.yaml
        elif [ -f package-lock.json ]; then
          name=npm
          lockfile=package-lock.json
        elif [ -f bun.lock ]; then
          name=bun
          lockfile=bun.lock
        elif [ -f bun.lockb ]; then
          name=bun
          lockfile=bun.lockb
        elif [ -f yarn.lock ]; then
          name=yarn
          lockfile=yarn.lock
          # yarn.lock is also Yarn Classic's lockfile, and Classic has neither
          # `--immutable` nor a `cacheFolder` setting — it answers `undefined`.
          major=$(yarn --version)
          major=${major%%.*}
          if [ "$major" -lt 2 ]; then
            echo "::error::yarn $major detected; this action supports Yarn Berry (>= 2) only"
            exit 1
          fi
        else
          echo "::error::no lockfile found (looked for pnpm-lock.yaml, package-lock.json, bun.lock, bun.lockb, yarn.lock)"
          exit 1
        fi

        store=$("$GITHUB_ACTION_PATH/pm.sh" store "$name")
        if [ -z "$store" ] || [ "$store" = "undefined" ]; then
          echo "::error::$name reported no cache directory (got '$store')"
          exit 1
        fi

        configs=$("$GITHUB_ACTION_PATH/mise-configs.sh" "$GITHUB_WORKSPACE")
        if [ -z "$configs" ]; then
          echo "::error::no mise config found under $GITHUB_WORKSPACE. mise reported:"
          mise config ls --json >&2
          exit 1
        fi

        {
          echo "name=$name"
          echo "lockfile=$lockfile"
          echo "store=$store"
          # actions/cache rejects a key containing a comma, and MISE_ENV takes a
          # comma-separated profile list.
          echo "mise_env=$(printf '%s' "${MISE_ENV-}" | tr ',' '-')"
          echo "mise_configs<<MISE_CONFIGS_EOF"
          echo "$configs"
          echo "MISE_CONFIGS_EOF"
        } >> "$GITHUB_OUTPUT"
        echo "detected $name, store at $store"
        echo "mise config: $(echo "$configs" | tr '\n' ' ')"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pm.outputs.store }}
        # The store path is absent from the key on purpose: actions/cache hashes
        # `path` into its cache version, so container and host jobs never collide.
        key: >-
          ${{ steps.pm.outputs.name }}-store-${{ runner.os }}-${{
          steps.pm.outputs.mise_env }}${{ steps.overrides.outputs.segment }}-${{
          hashFiles(steps.pm.outputs.lockfile, steps.pm.outputs.mise_configs) }}
        # Stops before the hash, but not before mise_env or the overrides: a
        # prefix ending at either matches a store another matrix leg built.
        restore-keys: >-
          ${{ steps.pm.outputs.name }}-store-${{ runner.os }}-${{
          steps.pm.outputs.mise_env }}${{ steps.overrides.outputs.segment }}-

    - shell: sh
      env:
        PM: ${{ steps.pm.outputs.name }}
      run: |
        "$GITHUB_ACTION_PATH/pm.sh" install "$PM"
