name: "Setup toolchain and install dependencies"
description: "Install mise-managed tools, then install dependencies with the package manager the lockfile selects"

runs:
  using: "composite"
  steps:
    - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

    - id: pm
      shell: bash
      run: |
        set -euo pipefail
        if [ -f pnpm-lock.yaml ]; then
          name=pnpm
          store=$(pnpm store path)
        elif [ -f package-lock.json ]; then
          name=npm
          store=$(npm config get cache)
        elif [ -f bun.lock ] || [ -f bun.lockb ]; then
          name=bun
          store=$(bun pm cache)
        elif [ -f yarn.lock ]; then
          name=yarn
          store=$(yarn config get cacheFolder)
        else
          echo "::error::no lockfile found (looked for pnpm-lock.yaml, package-lock.json, bun.lock, bun.lockb, yarn.lock)"
          exit 1
        fi
        {
          echo "name=$name"
          echo "store=$store"
        } >> "$GITHUB_OUTPUT"
        echo "detected $name, store at $store"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pm.outputs.store }}
        # The store path is in the key because container jobs resolve a different
        # $HOME than host jobs, and one's cache is useless in the other.
        key: ${{ steps.pm.outputs.name }}-store-${{ runner.os }}-${{ steps.pm.outputs.store }}-${{ hashFiles('pnpm-lock.yaml', 'package-lock.json', 'bun.lock', 'bun.lockb', 'yarn.lock', 'mise.toml') }}
        restore-keys: ${{ steps.pm.outputs.name }}-store-${{ runner.os }}-${{ steps.pm.outputs.store }}-

    - shell: bash
      env:
        PM: ${{ steps.pm.outputs.name }}
      run: |
        set -euo pipefail
        case "$PM" in
          pnpm) pnpm install --frozen-lockfile ;;
          npm) npm ci ;;
          bun) bun install --frozen-lockfile ;;
          yarn) yarn install --immutable ;;
          *) echo "::error::unknown package manager: $PM"; exit 1 ;;
        esac
